plugins {
    id "com.android.application"
}

android {
    namespace "com.otakuswonderland.otakusekai"
    compileSdk 34

    defaultConfig {
        applicationId "com.otakuswonderland.otakusekai"
        minSdk 24
        targetSdk 34
        versionCode APP_VERSION_CODE.toInteger()
        versionName APP_VERSION_NAME
    }

    // The signing key comes from the build machine's environment (GitHub secrets), never from the repository.
    signingConfigs {
        release {
            def ks = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_FILE")) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
